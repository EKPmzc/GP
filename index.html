<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Seeded Circle Mosaic Studio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    :root {
      color-scheme: dark;
      font-family: "Segoe UI", Roboto, sans-serif;
      background-color: #1e1e1e;
      color: #f0f0f0;
    }
    body {
      margin: 0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    header {
      background: #252525;
      border-bottom: 1px solid #333;
      padding: 0.75rem 1rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem 1.25rem;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    header label,
    header button {
      font-size: 0.9rem;
    }
    fieldset {
      border: 1px solid #333;
      border-radius: 8px;
      padding: 0.5rem 0.75rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem;
    }
    fieldset legend {
      padding: 0 0.25rem;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .slider-group {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      min-width: 200px;
    }
    .slider-group span {
      font-variant-numeric: tabular-nums;
      min-width: 3.5rem;
      text-align: right;
    }
    input[type="range"], input[type="text"], select, button {
      background: #1b1b1b;
      color: #f0f0f0;
      border: 1px solid #444;
      border-radius: 4px;
      padding: 0.25rem 0.5rem;
    }
    input[type="range"] {
      padding: 0;
    }
    button:hover {
      background: #333;
      cursor: pointer;
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 1rem;
    }
    #canvasContainer {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #333;
      border-radius: 12px;
      background: #141414;
      padding: 1rem;
      min-height: 300px;
    }
    canvas {
      max-width: 100%;
      max-height: 100%;
      border-radius: 10px;
      border: 1px solid #2f2f2f;
      background: #0b0b0b;
    }
    #status {
      margin-top: 0.5rem;
      font-size: 0.85rem;
      color: #ccc;
    }
    .hidden {
      display: none !important;
    }
    @media (max-width: 768px) {
      fieldset {
        width: 100%;
      }
      .slider-group {
        min-width: 160px;
      }
    }
  </style>
</head>
<body>
  <header>
    <fieldset>
      <legend>Source</legend>
      <button id="cameraToggleBtn">Start Camera</button>
      <label>
        <input type="checkbox" id="mirrorCheckbox" checked /> Mirror Webcam
      </label>
      <input type="file" id="imageInput" accept="image/*" />
    </fieldset>

    <fieldset>
      <legend>Mode</legend>
      <label><input type="radio" name="mode" value="uniform" checked /> Uniform</label>
      <label><input type="radio" name="mode" value="random" /> Random</label>
    </fieldset>

    <fieldset>
      <legend>Resolution</legend>
      <div class="slider-group">
        <input type="range" id="resSlider" min="1" max="200" value="40" />
        <span id="resValue">40×40</span>
      </div>
    </fieldset>

    <fieldset>
      <legend>Circle Size</legend>
      <div class="slider-group">
        <input type="range" id="sizeSlider" min="0.2" max="0.9" step="0.01" value="0.9" />
        <span id="sizeValue">0.90×</span>
      </div>
      <label class="slider-group">
        Jitter Strength
        <input type="range" id="jitterSlider" min="0" max="1" step="0.01" value="0.2" />
        <span id="jitterValue">0.20</span>
      </label>
      <label>
        <input type="checkbox" id="jitterCheckbox" /> Jitter Size by Brightness
      </label>
      <label>
        <input type="checkbox" id="outlineCheckbox" /> Outline Circles
      </label>
    </fieldset>

    <fieldset>
      <legend>Colors</legend>
      <label class="slider-group">
        Gamma
        <input type="range" id="gammaSlider" min="0.5" max="2" step="0.01" value="1" />
        <span id="gammaValue">1.00</span>
      </label>
      <label>
        Color Mode
        <select id="colorMode">
          <option value="source">Source Colors</option>
          <option value="grayscale">Grayscale</option>
          <option value="palette">Palette</option>
        </select>
      </label>
    </fieldset>

    <fieldset>
      <legend>Randomness</legend>
      <label class="slider-group">
        Seed
        <input type="text" id="seedInput" />
      </label>
      <button id="randomizeBtn">Randomize</button>
    </fieldset>

    <fieldset>
      <legend>Actions</legend>
      <button id="renderBtn">Render Once (Space)</button>
      <button id="downloadBtn">Download PNG (S)</button>
      <label>
        <input type="checkbox" id="liveCheckbox" /> Live Preview (~10 FPS)
      </label>
    </fieldset>
  </header>

  <main>
    <div id="canvasContainer">
      <canvas id="mosaicCanvas"></canvas>
    </div>
    <div id="status">Load an image or start the camera to begin.</div>
  </main>

  <video id="sourceVideo" class="hidden" playsinline></video>
  <canvas id="sourceCanvas" class="hidden"></canvas>

  <script>
    const state = {
      mode: 'uniform',
      live: false,
      runningCamera: false,
      seed: Date.now(),
      rng: null,
      sourceReady: false,
      sourceWidth: 640,
      sourceHeight: 480,
      palette: [
        { r: 33, g: 37, b: 41 },
        { r: 214, g: 40, b: 40 },
        { r: 247, g: 127, b: 0 },
        { r: 252, g: 191, b: 73 },
        { r: 234, g: 226, b: 183 },
        { r: 29, g: 53, b: 87 },
        { r: 69, g: 123, b: 157 },
        { r: 168, g: 218, b: 220 },
        { r: 102, g: 45, b: 145 },
        { r: 144, g: 190, b: 109 }
      ]
    };

    let liveTimer = 0;
    let liveScheduled = false;

    document.addEventListener('DOMContentLoaded', () => {
      initUI();
      state.seed = Date.now();
      document.getElementById('seedInput').value = state.seed;
      updateModeSpecificControls();
      updateResolutionLabel();
      updateSizeLabel();
      updateGammaLabel();
      updateJitterLabel();
      render();
    });

    function initUI() {
      const cameraToggleBtn = document.getElementById('cameraToggleBtn');
      cameraToggleBtn.addEventListener('click', () => {
        if (state.runningCamera) {
          stopCamera();
        } else {
          startCamera();
        }
      });

      document.getElementById('imageInput').addEventListener('change', (e) => {
        if (e.target.files && e.target.files[0]) {
          setSourceToImage(e.target.files[0]);
        }
      });

      document.querySelectorAll('input[name="mode"]').forEach((radio) => {
        radio.addEventListener('change', () => {
          if (radio.checked) {
            state.mode = radio.value;
            updateModeSpecificControls();
            render();
          }
        });
      });

      document.getElementById('resSlider').addEventListener('input', () => {
        updateResolutionLabel();
        render();
      });

      document.getElementById('sizeSlider').addEventListener('input', () => {
        updateSizeLabel();
        render();
      });

      const jitterSlider = document.getElementById('jitterSlider');
      const jitterCheckbox = document.getElementById('jitterCheckbox');

      jitterSlider.addEventListener('input', () => {
        updateJitterLabel();
        if (jitterCheckbox.checked) {
          render();
        }
      });

      jitterCheckbox.addEventListener('change', () => {
        jitterSlider.disabled = !jitterCheckbox.checked;
        render();
      });
      jitterSlider.disabled = !jitterCheckbox.checked;

      document.getElementById('outlineCheckbox').addEventListener('change', render);
      document.getElementById('mirrorCheckbox').addEventListener('change', render);

      document.getElementById('gammaSlider').addEventListener('input', () => {
        updateGammaLabel();
        render();
      });

      document.getElementById('colorMode').addEventListener('change', render);

      document.getElementById('seedInput').addEventListener('change', () => {
        state.seed = seedFromString(document.getElementById('seedInput').value);
        render();
      });

      document.getElementById('randomizeBtn').addEventListener('click', () => {
        const newSeed = Math.floor(Math.random() * 1e9);
        document.getElementById('seedInput').value = newSeed;
        state.seed = seedFromString(String(newSeed));
        render();
      });

      document.getElementById('renderBtn').addEventListener('click', () => {
        render();
      });

      document.getElementById('downloadBtn').addEventListener('click', () => {
        downloadPNG();
      });

      document.getElementById('liveCheckbox').addEventListener('change', (e) => {
        state.live = e.target.checked;
        if (state.live) {
          scheduleLiveRender();
        } else {
          liveScheduled = false;
          cancelAnimationFrame(liveTimer);
        }
      });

      document.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
        if (e.key === 'r' || e.key === 'R') {
          document.getElementById('randomizeBtn').click();
        } else if (e.key === ' ') {
          e.preventDefault();
          document.getElementById('renderBtn').click();
        } else if (e.key === 's' || e.key === 'S') {
          e.preventDefault();
          document.getElementById('downloadBtn').click();
        }
      });
    }

    function startCamera() {
      const video = document.getElementById('sourceVideo');
      const status = document.getElementById('status');
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        status.textContent = 'getUserMedia is not supported in this browser.';
        return;
      }
      navigator.mediaDevices.getUserMedia({ video: true })
        .then((stream) => {
          video.srcObject = stream;
          return video.play();
        })
        .then(() => {
          state.runningCamera = true;
          document.getElementById('cameraToggleBtn').textContent = 'Stop Camera';
          status.textContent = 'Camera running. Press Render Once to capture a frame.';
          video.addEventListener('loadedmetadata', () => {
            state.sourceWidth = video.videoWidth;
            state.sourceHeight = video.videoHeight;
            state.sourceReady = true;
            render();
          }, { once: true });
        })
        .catch((err) => {
          console.error('Camera error', err);
          status.textContent = 'Unable to access camera: ' + err.message;
        });
    }

    function stopCamera() {
      const video = document.getElementById('sourceVideo');
      const stream = video.srcObject;
      if (stream) {
        stream.getTracks().forEach((track) => track.stop());
      }
      video.srcObject = null;
      state.runningCamera = false;
      document.getElementById('cameraToggleBtn').textContent = 'Start Camera';
    }

    function setSourceToImage(file) {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          stopCamera();
          const sourceCanvas = document.getElementById('sourceCanvas');
          const sctx = sourceCanvas.getContext('2d');
          sourceCanvas.width = img.width;
          sourceCanvas.height = img.height;
          sctx.drawImage(img, 0, 0);
          state.sourceWidth = img.width;
          state.sourceHeight = img.height;
          state.sourceReady = true;
          document.getElementById('status').textContent = 'Image loaded. Press Render Once to update.';
          render();
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function render() {
      const canvas = document.getElementById('mosaicCanvas');
      const ctx = canvas.getContext('2d');
      const status = document.getElementById('status');
      if (!state.sourceReady) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        status.textContent = 'No source loaded. Start the camera or upload an image.';
        return;
      }

      if (state.runningCamera) {
        const video = document.getElementById('sourceVideo');
        const sourceCanvas = document.getElementById('sourceCanvas');
        const sctx = sourceCanvas.getContext('2d');
        sourceCanvas.width = video.videoWidth;
        sourceCanvas.height = video.videoHeight;
        sctx.save();
        if (document.getElementById('mirrorCheckbox').checked) {
          sctx.translate(sourceCanvas.width, 0);
          sctx.scale(-1, 1);
        }
        sctx.drawImage(video, 0, 0, sourceCanvas.width, sourceCanvas.height);
        sctx.restore();
      }

      resizeCanvasToContainer();

      const seedValue = document.getElementById('seedInput').value || String(state.seed);
      state.seed = seedFromString(seedValue);
      state.rng = mulberry32(state.seed);

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#101010';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const params = gatherParameters();
      const sampleFn = (x, y) => sampleColorAt(x, y);

      const count = state.mode === 'uniform'
        ? renderUniformGrid(ctx, params, sampleFn)
        : renderRandomPoisson(ctx, params, sampleFn);

      if (state.mode === 'uniform') {
        status.textContent = `Uniform grid (${params.resolution}×${params.resolution} = ${params.resolution * params.resolution} circles) rendered with seed ${state.seed}.`;
      } else {
        status.textContent = `Random layout (${count} circles) rendered with seed ${state.seed}.`;
      }

      if (state.live && !liveScheduled) {
        scheduleLiveRender();
      }
      if (!state.live) {
        liveScheduled = false;
        cancelAnimationFrame(liveTimer);
      }
    }

    function scheduleLiveRender() {
      liveScheduled = true;
      cancelAnimationFrame(liveTimer);
      liveTimer = requestAnimationFrame(() => {
        setTimeout(() => {
          liveScheduled = false;
          if (state.live) {
            render();
          }
        }, 100);
      });
    }

    function resizeCanvasToContainer() {
      const canvas = document.getElementById('mosaicCanvas');
      const container = document.getElementById('canvasContainer');
      const maxWidth = Math.max(50, container.clientWidth - 20);
      const maxHeight = Math.max(50, container.clientHeight - 20);
      const scale = Math.min(maxWidth / state.sourceWidth, maxHeight / state.sourceHeight);
      const width = Math.max(1, Math.floor(state.sourceWidth * scale));
      const height = Math.max(1, Math.floor(state.sourceHeight * scale));
      canvas.width = width;
      canvas.height = height;
      canvas.style.width = width + 'px';
      canvas.style.height = height + 'px';
    }

    function gatherParameters() {
      const resSlider = document.getElementById('resSlider');
      const sizeSlider = document.getElementById('sizeSlider');
      const jitterStrength = parseFloat(document.getElementById('jitterSlider').value);
      const gamma = parseFloat(document.getElementById('gammaSlider').value);
      const jitterEnabled = document.getElementById('jitterCheckbox').checked;
      const outline = document.getElementById('outlineCheckbox').checked;
      const colorMode = document.getElementById('colorMode').value;
      return {
        resolution: parseInt(resSlider.value, 10),
        sizeFactor: parseFloat(sizeSlider.value),
        jitterStrength,
        jitterEnabled,
        outline,
        colorMode,
        gamma,
        palette: state.palette,
        width: document.getElementById('mosaicCanvas').width,
        height: document.getElementById('mosaicCanvas').height
      };
    }

    function renderUniformGrid(ctx, params, sampleFn) {
      const { resolution, sizeFactor, jitterStrength, jitterEnabled, outline, colorMode, gamma, palette, width, height } = params;
      const cellWidth = width / resolution;
      const cellHeight = height / resolution;
      const radiusBase = Math.min(cellWidth, cellHeight) * 0.5 * sizeFactor;

      for (let i = 0; i < resolution; i++) {
        for (let j = 0; j < resolution; j++) {
          const cx = (j + 0.5) * cellWidth;
          const cy = (i + 0.5) * cellHeight;
          const color = sampleFn(cx, cy);
          const gammaColor = applyGamma(color, gamma);
          const luminance = toLuminance(gammaColor);
          let circleColor = gammaColor;

          if (colorMode === 'grayscale') {
            const gray = toGrayscale(gammaColor);
            circleColor = gray;
          } else if (colorMode === 'palette') {
            circleColor = nearestPaletteColor(gammaColor, palette);
          }

          let radius = radiusBase;
          if (jitterEnabled) {
            // Darker luminance -> larger radius when jitter is active.
            const multiplier = 1 + jitterStrength * (0.5 - luminance) * 2;
            radius *= Math.max(0.1, multiplier);
          }

          drawCircle(ctx, cx, cy, radius, circleColor, outline);
        }
      }
      return resolution * resolution;
    }

    function renderRandomPoisson(ctx, params, sampleFn) {
      // Seeded dart-throwing approximation of Poisson-disc sampling.
      const { resolution, sizeFactor, jitterStrength, jitterEnabled, outline, colorMode, gamma, palette, width, height } = params;
      const targetCount = resolution;
      const baseRadius = sizeFactor;
      const jitterMax = jitterEnabled ? jitterStrength : 0;
      const maxRadius = baseRadius * (1 + jitterMax);
      const cellSize = maxRadius * 2;
      const gridWidth = Math.ceil(width / cellSize);
      const gridHeight = Math.ceil(height / cellSize);
      const grid = new Array(gridWidth * gridHeight).fill(null).map(() => []);
      const circles = [];
      const rng = state.rng;
      const maxAttempts = targetCount * 30;
      let attempts = 0;

      while (circles.length < targetCount && attempts < maxAttempts) {
        attempts++;
        const x = rng() * width;
        const y = rng() * height;
        const color = sampleFn(x, y);
        const gammaColor = applyGamma(color, gamma);
        const luminance = toLuminance(gammaColor);
        let circleColor = gammaColor;

        if (colorMode === 'grayscale') {
          circleColor = toGrayscale(gammaColor);
        } else if (colorMode === 'palette') {
          circleColor = nearestPaletteColor(gammaColor, palette);
        }

        let radius = baseRadius;
        if (jitterEnabled) {
          // Darker luminance -> larger radius when jitter is active.
          const multiplier = 1 + jitterStrength * (0.5 - luminance) * 2;
          radius *= Math.max(0.2, multiplier);
        }

        const gx = Math.min(gridWidth - 1, Math.max(0, Math.floor(x / cellSize)));
        const gy = Math.min(gridHeight - 1, Math.max(0, Math.floor(y / cellSize)));
        let fits = true;
        for (let i = Math.max(0, gx - 2); i <= Math.min(gridWidth - 1, gx + 2) && fits; i++) {
          for (let j = Math.max(0, gy - 2); j <= Math.min(gridHeight - 1, gy + 2) && fits; j++) {
            const cell = grid[i + j * gridWidth];
            for (const idx of cell) {
              const other = circles[idx];
              const dx = other.x - x;
              const dy = other.y - y;
              const dist = Math.hypot(dx, dy);
              if (dist < other.radius + radius) {
                fits = false;
                break;
              }
            }
          }
        }

        if (!fits) continue;

        const circle = { x, y, radius, color: circleColor };
        circles.push(circle);
        grid[gx + gy * gridWidth].push(circles.length - 1);
      }

      circles.forEach((circle) => {
        drawCircle(ctx, circle.x, circle.y, circle.radius, circle.color, outline);
      });
      return circles.length;
    }

    function drawCircle(ctx, x, y, radius, color, outline) {
      ctx.beginPath();
      ctx.arc(x, y, radius, 0, Math.PI * 2);
      const r = Math.round(color.r);
      const g = Math.round(color.g);
      const b = Math.round(color.b);
      const alpha = color.a !== undefined ? color.a / 255 : 1;
      ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${alpha})`;
      ctx.fill();
      if (outline) {
        ctx.lineWidth = 1;
        ctx.strokeStyle = 'rgba(0,0,0,0.6)';
        ctx.stroke();
      }
    }

    function sampleColorAt(x, y) {
      const sourceCanvas = document.getElementById('sourceCanvas');
      const sctx = sourceCanvas.getContext('2d');
      // Map from display canvas space back to the source (video/image) pixel grid.
      const sx = x * (state.sourceWidth / document.getElementById('mosaicCanvas').width);
      const sy = y * (state.sourceHeight / document.getElementById('mosaicCanvas').height);
      const px = Math.min(state.sourceWidth - 1, Math.max(0, Math.floor(sx)));
      const py = Math.min(state.sourceHeight - 1, Math.max(0, Math.floor(sy)));
      const data = sctx.getImageData(px, py, 1, 1).data;
      return { r: data[0], g: data[1], b: data[2], a: data[3] };
    }

    function seedFromString(str) {
      // Lightweight string hash -> 32-bit unsigned seed for the PRNG.
      let h = 1779033703 ^ str.length;
      for (let i = 0; i < str.length; i++) {
        h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
        h = (h << 13) | (h >>> 19);
      }
      return (h >>> 0);
    }

    function mulberry32(a) {
      // Deterministic 32-bit PRNG with good distribution for visual work.
      return function () {
        a |= 0; a = a + 0x6D2B79F5 | 0;
        let t = Math.imul(a ^ a >>> 15, 1 | a);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }

    function applyGamma(rgb, gamma) {
      // Apply gamma correction before deriving grayscale or palette matches.
      const correct = (channel) => Math.min(255, Math.max(0, Math.pow(channel / 255, gamma) * 255));
      return {
        r: Math.round(correct(rgb.r)),
        g: Math.round(correct(rgb.g)),
        b: Math.round(correct(rgb.b)),
        a: rgb.a
      };
    }

    function toGrayscale(rgb) {
      const l = Math.round(toLuminance(rgb) * 255);
      return { r: l, g: l, b: l, a: rgb.a };
    }

    function toLuminance(rgb) {
      return (0.2126 * (rgb.r / 255) + 0.7152 * (rgb.g / 255) + 0.0722 * (rgb.b / 255));
    }

    function nearestPaletteColor(rgb, palette) {
      // Pick the palette entry with minimum Euclidean distance in RGB space.
      let best = palette[0];
      let bestDist = Infinity;
      for (const color of palette) {
        const dr = color.r - rgb.r;
        const dg = color.g - rgb.g;
        const db = color.b - rgb.b;
        const dist = dr * dr + dg * dg + db * db;
        if (dist < bestDist) {
          bestDist = dist;
          best = color;
        }
      }
      return { r: best.r, g: best.g, b: best.b, a: rgb.a };
    }

    function downloadPNG() {
      const canvas = document.getElementById('mosaicCanvas');
      const link = document.createElement('a');
      link.download = 'circles.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    function updateResolutionLabel() {
      const value = parseInt(document.getElementById('resSlider').value, 10);
      const label = document.getElementById('resValue');
      if (state.mode === 'uniform') {
        label.textContent = `${value}×${value}`;
      } else {
        label.textContent = `${value} circles`;
      }
      if (state.mode === 'uniform') {
        document.getElementById('resSlider').min = 1;
        document.getElementById('resSlider').max = 200;
        const sizeSlider = document.getElementById('sizeSlider');
        sizeSlider.min = 0.2;
        sizeSlider.max = 0.9;
        sizeSlider.step = 0.01;
        sizeSlider.value = Math.min(0.9, Math.max(0.2, parseFloat(sizeSlider.value)));
      } else {
        document.getElementById('resSlider').min = 10;
        document.getElementById('resSlider').max = 10000;
      }
    }

    function updateSizeLabel() {
      const value = parseFloat(document.getElementById('sizeSlider').value);
      const label = document.getElementById('sizeValue');
      if (state.mode === 'uniform') {
        label.textContent = value.toFixed(2) + '×';
      } else {
        label.textContent = value.toFixed(1) + ' px';
      }
    }

    function updateGammaLabel() {
      const value = parseFloat(document.getElementById('gammaSlider').value);
      document.getElementById('gammaValue').textContent = value.toFixed(2);
    }

    function updateJitterLabel() {
      const value = parseFloat(document.getElementById('jitterSlider').value);
      document.getElementById('jitterValue').textContent = value.toFixed(2);
    }

    function updateModeSpecificControls() {
      const resSlider = document.getElementById('resSlider');
      const sizeSlider = document.getElementById('sizeSlider');
      if (state.mode === 'uniform') {
        resSlider.min = 1;
        resSlider.max = 200;
        if (parseInt(resSlider.value, 10) > 200) resSlider.value = 40;
        sizeSlider.min = 0.2;
        sizeSlider.max = 0.9;
        sizeSlider.step = 0.01;
        if (parseFloat(sizeSlider.value) > 0.9) sizeSlider.value = 0.9;
      } else {
        resSlider.min = 10;
        resSlider.max = 10000;
        if (parseInt(resSlider.value, 10) < 10) resSlider.value = 1500;
        sizeSlider.min = 2;
        sizeSlider.max = 40;
        sizeSlider.step = 0.1;
        if (parseFloat(sizeSlider.value) < 2) sizeSlider.value = 8;
      }
      updateResolutionLabel();
      updateSizeLabel();
    }
  </script>
</body>
</html>
